# ── fly.toml — Configuração do Arcturus no Fly.io ───────────────────────────
# Este arquivo é gerado uma vez e commitado no GitHub.
# Troque "arcturus-server" pelo nome que você escolher no fly launch.

app = "arcturus-server"
primary_region = "gru"  # gru = São Paulo — mais próximo do Brasil

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = false  # não dorme! diferente do Render
  auto_start_machines = true
  min_machines_running = 1

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  # DATABASE_URL é definida como secret (fly secrets set), não aqui

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
